name: Update README cards

on:
  schedule:
    - cron: "0 */12 * * *"
  push:
    paths:
      - ".github/workflows/readme-cards.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-cards
  cancel-in-progress: true

env:
  # Opcional: crea el secreto PROFILE_TOKEN (PAT) para incluir también actividad privada
  TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
  STYLE: theme=tokyonight&hide_border=true&locale=es

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&${{ env.STYLE }}
          path: profile/stats.svg
          token: ${{ env.TOKEN }}

      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&${{ env.STYLE }}
          path: profile/top-langs.svg
          token: ${{ env.TOKEN }}

      - name: Generate streak card
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=${{ github.repository_owner }}&timezone=America/Mexico_City&${{ env.STYLE }}
          path: profile/streak.svg
          token: ${{ env.TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
