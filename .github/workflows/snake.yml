name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  push:
    paths:
      - ".github/workflows/snake.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: erick-g-c
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/snake-cyberpunk.svg?color_snake=#ff003c&color_dots=#1a1a2e,#3d0066,#7a00cc,#bd00ff,#00ff9f

      - name: Push snake to output branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: output
          folder: dist