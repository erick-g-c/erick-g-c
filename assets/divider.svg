<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="16" viewBox="0 0 1000 16" role="img" aria-label="separador">
<defs>
  <linearGradient id="d" x1="0" x2="1">
    <stop offset="0" stop-color="#ff003c" stop-opacity="0"/><stop offset=".2" stop-color="#ff003c"/>
    <stop offset=".5" stop-color="#bd00ff"/><stop offset=".8" stop-color="#00f0ff"/><stop offset="1" stop-color="#00f0ff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="s" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#00ff9f"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <filter id="g" x="-10%" y="-200%" width="120%" height="500%"><feGaussianBlur stdDeviation="2"/></filter>
</defs>
<style>.s { animation: s 3.5s linear infinite; } @keyframes s { from { transform: translateX(-160px) } to { transform: translateX(1000px) } }</style>
<rect x="0" y="7" width="1000" height="2" fill="url(#d)" filter="url(#g)"/>
<rect x="0" y="7" width="1000" height="2" fill="url(#d)"/>
<rect class="s" x="0" y="6" width="160" height="4" fill="url(#s)"/>
<rect x="490" y="4" width="20" height="8" fill="#0b0b12" stroke="#00ff9f" transform="rotate(45 500 8)"/>
</svg>
