<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="180" viewBox="0 0 1000 180" role="img" aria-label="Erick García — Frontend Developer">
  <style>
    text { font-family: ui-monospace, 'SFMono-Regular', 'JetBrains Mono', Consolas, 'Liberation Mono', Menlo, monospace; }
    .name { font-size: 54px; font-weight: 800; letter-spacing: 3px; }
    .sub { font-size: 18px; letter-spacing: 2px; }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0 } }
  </style>
  <rect x="1" y="1" width="998" height="178" rx="12" fill="#0b0b12" stroke="#bd00ff" stroke-opacity=".6"/>
  <text x="500" y="92" text-anchor="middle" class="name" fill="#00ff9f">ERICK GARCÍA</text>
  <text x="500" y="132" text-anchor="middle" class="sub" fill="#00f0ff">Frontend Developer Jr · CDMX<tspan class="cursor" fill="#ff003c">_</tspan></text>
</svg>
